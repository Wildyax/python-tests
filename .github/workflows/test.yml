name: Run Tests

on:
  push:
  pull_request:

jobs:

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask

      - name: Lancer les tests unitaires
        run: |
          pytest test_app.py

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest flask

      - name: Lancer les tests d'intégration
        run: |
          pytest test_integration.py

  coverage:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage flask

      - name: Vérifier le coverage global
        run: |
          coverage run -m pytest
          coverage report --fail-under=90

  sonarqube:
    name: SonarCloud Analysis
    needs: coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyse SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=Wildyax_python-tests
            -Dsonar.organization=wildyax
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Ruff
        run: |
          pip install ruff

      - name: Lancer Ruff
        run: |
          ruff check .
